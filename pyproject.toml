[project]
name = "customer-support-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "dataclasses>=0.8",
    "fastapi>=0.162.7",
    "groq<1",
    "guardrails-ai>=0.5",
    "ipykernel>=7.4.0",
    "langchain>=1.4.9",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.8.0",
    "langchain-text-splitters>=1.1.3",
    "load-dotenv>=0.1.0",
    "mem0ai>=2.2.1",
    "pydantic-settings>=2.16.2",
    "pydantic[email]>=2.14.2",
    "spacy>=3.7",
    "streamlit>=1.67.0",
    "typing>=3.10.0.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
  "playwright>=1.58.0",
  "pytest",
  "ragas>=0.2",
  "deepeval>=1.0",
  "rapidfuzz>=3.10",
]

[tool.pytest.ini_options]
markers = [
  "full_eval: marks the full RAG + agent evaluation suite",
]
filterwarnings = [
  "ignore:Importing NonLLMContextPrecisionWithReference from 'ragas.metrics' is deprecated:DeprecationWarning",
  "ignore:.*LangchainEmbeddingsWrapper is deprecated.*:DeprecationWarning",
  "ignore:.*LangchainLLMWrapper is deprecated.*:DeprecationWarning",
]